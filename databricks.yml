# This is a Declarative Automation Bundle definition for sec_sentiment_rag.
# See https://docs.databricks.com/dev-tools/bundles/index.html for documentation.
bundle:
  name: sec_sentiment_rag
  uuid: 84973897-59c4-4552-bf72-a9b6b6120eac

include:
  - resources/*.yml

artifacts:
  python_artifact:
    type: whl
    build: uv build --wheel

# Variable declarations. These variables are assigned in the dev/prod targets below.
variables:
  catalog:
    description: The catalog to use
  schema:
    description: The schema to use

targets:
  dev:
    # The default target uses 'mode: development' to create a development copy.
    # - Deployed resources get prefixed with '[dev my_user_name]'
    # - Any job schedules and triggers are paused by default.
    # See also https://docs.databricks.com/dev-tools/bundles/deployment-modes.html.
    mode: development
    default: true
    workspace:
      host: https://dbc-c7d07fb4-0977.cloud.databricks.com
    variables:
      catalog: sec_sentiment
      schema: ${workspace.current_user.short_name}
  prod:
    mode: production
    workspace:
      host: https://dbc-c7d07fb4-0977.cloud.databricks.com
      # Resolve the deploying Databricks user's workspace path at runtime.
      root_path: /Workspace/Users/${workspace.current_user.userName}/.bundle/${bundle.name}/${bundle.target}
    variables:
      catalog: sec_sentiment
      schema: prod
    permissions:
      - user_name: ${workspace.current_user.userName}
        level: CAN_MANAGE
