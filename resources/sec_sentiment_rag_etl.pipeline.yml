# The main pipeline for sec_sentiment_rag

resources:
  pipelines:
    sec_sentiment_rag_etl:
      name: sec_sentiment_rag_etl
      catalog: ${var.catalog}
      schema: ${var.schema}
      serverless: true
      root_path: "../src/sec_sentiment_rag_etl"

      libraries:
        - glob:
            include: ../src/sec_sentiment_rag_etl/transformations/**

      environment:
        dependencies:
          # We include every dependency defined by pyproject.toml by defining an editable environment
          # that points to the folder where pyproject.toml is deployed.
          - --editable ${workspace.file_path}
